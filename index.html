<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>POP DOSSIER Collocation Match</title>
<style>
:root{--ink:#10182f;--paper:#f5f6fb;--card:#fff;--coral:#ff6b5f;--pink:#ffb4c8;--lime:#c9f269;--cyan:#73d9e7;--violet:#7963ff;--muted:#697086;--line:#1b2440;--good:#13805d;--bad:#cf3155;--shadow:4px 4px 0 var(--line)}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:Inter,ui-rounded,"Avenir Next",system-ui,sans-serif;min-height:100vh}button{font:inherit;color:inherit}.shell{width:min(1460px,calc(100% - 26px));margin:auto;padding:12px 0 34px}.top{min-height:74px;background:#fff;border:2px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;padding:11px 15px;position:sticky;top:6px;z-index:10;flex-wrap:wrap}.brand{font-weight:1000;letter-spacing:.07em;text-transform:uppercase;margin-right:auto}.brand span{color:var(--violet)}.clock{font-size:1.45rem;font-weight:1000;font-variant-numeric:tabular-nums;min-width:80px;text-align:center}.mini{border:2px solid var(--line);background:var(--lime);padding:8px 11px;font-weight:950;cursor:pointer;box-shadow:2px 2px 0 var(--line)}.mini.sound{background:var(--cyan)}.mini.mode{background:var(--pink)}.mini:active,.setBtn:active,.action:active{transform:translate(2px,2px);box-shadow:none}.sets{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:16px 0 12px}.setBtn{border:2px solid var(--line);background:#fff;padding:11px 8px;font-weight:950;box-shadow:3px 3px 0 var(--line);cursor:pointer}.setBtn.active{background:var(--cyan)}.panel{background:#fff;border:2px solid var(--line);box-shadow:var(--shadow)}.bar{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:2px solid var(--line);background:linear-gradient(90deg,var(--pink),#ffd9a5);flex-wrap:wrap}.dossier{background:var(--ink);color:#fff;padding:6px 9px;font-weight:1000;letter-spacing:.06em}.round{font-weight:950}.score{margin-left:auto;font-weight:950}.meter{height:10px;background:#e6e8f0;border-bottom:2px solid var(--line)}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--coral),var(--violet));transition:.25s}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:clamp(14px,2vw,24px);min-height:620px;align-content:center;background-image:radial-gradient(#d9dce8 1px,transparent 1px);background-size:19px 19px}.card{min-height:180px;border:2px solid #cfd4e2;border-radius:18px;background:var(--card);padding:18px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(1rem,1.4vw,1.28rem);line-height:1.38;font-weight:800;cursor:pointer;box-shadow:0 8px 20px #28304b18;transition:.16s;overflow:hidden}.card:hover{transform:translateY(-3px);border-color:var(--violet)}.card.term{font-size:clamp(1.15rem,1.8vw,1.6rem);font-weight:1000;background:#fffdf7}.card small{display:block;color:#6249db;font-weight:850;margin-top:9px;font-size:.8em}.card.selected{border-color:var(--violet);background:#eef0ff;box-shadow:0 0 0 3px #7963ff25}.card.wrong{border-color:var(--bad);background:#fff0f4;animation:shake .32s}.card.matched{opacity:0;transform:scale(.82);pointer-events:none}.paused .card{pointer-events:none;filter:grayscale(.5)}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}.actions{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;padding:12px 14px;border-top:2px solid var(--line)}.action{border:2px solid var(--line);background:#fff;padding:10px 13px;font-weight:950;box-shadow:3px 3px 0 var(--line);cursor:pointer}.action.primary{background:var(--coral);color:#fff}.action.danger{background:#ffe3ea}.overlay{position:fixed;inset:0;background:#10182fbb;display:none;align-items:center;justify-content:center;padding:20px;z-index:30}.overlay.show{display:flex}.result{width:min(520px,100%);background:#fff;border:3px solid var(--line);box-shadow:9px 9px 0 var(--line);padding:28px;text-align:center}.result .stamp{display:inline-block;background:var(--lime);border:2px solid var(--line);padding:6px 10px;font-weight:1000}.result h2{font-family:Georgia,serif;font-size:2rem;margin:16px 0 8px}.result p{color:var(--muted);font-weight:750}.result button{margin-top:12px}.pausedFlag{display:none;position:fixed;inset:auto 50% 24px auto;transform:translateX(50%);background:var(--ink);color:#fff;padding:9px 14px;font-weight:950;z-index:15}.paused .pausedFlag{display:block}
.mini.game{background:#ffd9a5}.grid.columns{grid-template-columns:1fr 1fr;align-content:start}.matchColumn{display:grid;gap:10px;align-content:start}.matchColumn h3{margin:0;padding:10px;text-align:center;background:var(--ink);color:#fff;border-radius:12px;letter-spacing:.08em}.columns .card{min-height:78px;border-radius:13px}.columns .card.left{background:#fffdf7;font-size:clamp(1.08rem,1.6vw,1.4rem)}.columns .card.right{background:#f1fbfd}
@media(max-width:980px){.grid:not(.columns){grid-template-columns:repeat(3,minmax(0,1fr))}.card{min-height:160px}}
@media(max-width:680px){.shell{width:min(100% - 12px,1460px);padding-top:6px}.top{top:3px}.brand{width:100%;margin:0}.sets{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:10px;min-height:auto}.card{min-height:145px;padding:11px;font-size:.96rem;border-radius:13px}.card.term{font-size:1.12rem}.columns .card{min-height:70px;padding:9px;font-size:.92rem}.matchColumn{gap:7px}.score{margin-left:0}.actions{justify-content:stretch}.action{flex:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="shell" id="app">
  <header class="top">
    <div class="brand">POP DOSSIER <span>Match Lab</span></div>
    <div class="clock" id="clock">0.0</div>
    <button class="mini" id="pause">Pause</button>
    <button class="mini sound" id="sound">Sound on</button>
    <button class="mini mode" id="mode">English only</button>
    <button class="mini game" id="game">Columns A–B</button>
  </header>
  <nav class="sets" id="sets"></nav>
  <section class="panel">
    <div class="bar"><span class="dossier">MATCH FILE</span><span class="round" id="roundLabel"></span><span class="score" id="score"></span></div>
    <div class="meter"><i id="meter"></i></div>
    <div class="grid" id="grid"></div>
    <div class="actions"><button class="action" id="shuffle">Shuffle cards</button><button class="action primary" id="resetRound">Reset round</button><button class="action danger" id="resetAll">Reset all</button></div>
  </section>
  <div class="pausedFlag">Paused</div>
</main>
<div class="overlay" id="overlay"><div class="result"><span class="stamp" id="stamp">ROUND COMPLETE</span><h2 id="resultTitle"></h2><p id="resultText"></p><button class="action primary" id="continue">Next round</button></div></div>
<script>
const DATA=[{"id":1,"set":1,"collocation":"reliable colleague","meaning":"đồng nghiệp đáng tin cậy","situation":"Linh always finishes her work on time and everyone in the team can trust her","translation":"Linh là một đồng nghiệp đáng tin cậy, luôn hoàn thành đúng hạn."},{"id":2,"set":1,"collocation":"face the consequences","meaning":"đối mặt với hậu quả","situation":"We saw the warning but did not follow it and now we may have serious problems","translation":"Nếu phớt lờ cảnh báo, chúng ta có thể phải đối mặt với hậu quả."},{"id":3,"set":1,"collocation":"relieve pain","meaning":"giảm đau","situation":"You have a headache and this medicine can make you feel better soon","translation":"Thuốc này sẽ giúp giảm đau trong vòng một giờ."},{"id":4,"set":1,"collocation":"stubborn person","meaning":"người bướng bỉnh","situation":"Ben does not want to change his plan even when other people give him good reasons","translation":"Ben có thể là một người bướng bỉnh khi kế hoạch thay đổi."},{"id":5,"set":1,"collocation":"brief interruption","meaning":"gián đoạn ngắn","situation":"The online lesson stopped for two minutes and then continued","translation":"Đã có một sự gián đoạn ngắn trong buổi học trực tuyến."},{"id":6,"set":1,"collocation":"buy online","meaning":"mua trực tuyến","situation":"Many students shop on websites because it saves time","translation":"Nhiều sinh viên mua hàng trực tuyến để tiết kiệm thời gian."},{"id":7,"set":1,"collocation":"precise measurement","meaning":"phép đo chính xác","situation":"The engineer needed the exact size of the small space","translation":"Kỹ sư đã ghi lại số đo chính xác của khe hở."},{"id":8,"set":1,"collocation":"seldom visit","meaning":"hiếm khi ghé thăm","situation":"We almost never go to the city centre on Saturdays or Sundays","translation":"Chúng tôi hiếm khi đến trung tâm thành phố vào cuối tuần."},{"id":9,"set":1,"collocation":"allow access","meaning":"cho phép truy cập","situation":"Students can open the course materials only when they use their password","translation":"Mật khẩu sẽ cho phép truy cập tài liệu khóa học."},{"id":10,"set":1,"collocation":"huge amount","meaning":"lượng rất lớn","situation":"The repair was very difficult and needed a lot of work","translation":"Việc sửa chữa đòi hỏi một khối lượng công việc rất lớn."},{"id":11,"set":1,"collocation":"pay attention","meaning":"chú ý","situation":"The trainer is giving important safety information and you need to listen carefully","translation":"Bạn phải chú ý trong buổi hướng dẫn an toàn."},{"id":12,"set":1,"collocation":"gain experience","meaning":"tích lũy kinh nghiệm","situation":"Mai works at a charity without pay because she wants to learn useful work skills","translation":"Làm tình nguyện là một cách tốt để tích lũy kinh nghiệm."},{"id":13,"set":1,"collocation":"heavy rain","meaning":"mưa lớn","situation":"It rained a lot last night and water covered several streets","translation":"Mưa lớn đã làm ngập một số con phố tối qua."},{"id":14,"set":1,"collocation":"reach an agreement","meaning":"đạt thỏa thuận","situation":"Two groups are talking and hope to accept the same plan today","translation":"Hai bên hy vọng đạt được thỏa thuận hôm nay."},{"id":15,"set":1,"collocation":"postpone a meeting","meaning":"hoãn cuộc họp","situation":"The manager was ill so the team moved the meeting to another day","translation":"Chúng tôi phải hoãn một cuộc họp vì quản lý bị ốm."},{"id":16,"set":1,"collocation":"take action","meaning":"hành động","situation":"The air in the city is dirty and the council needs to do something now","translation":"Hội đồng phải hành động để giảm ô nhiễm không khí."},{"id":17,"set":1,"collocation":"highly qualified","meaning":"có chuyên môn cao","situation":"The company needs an accountant with excellent training and professional skills","translation":"Công ty cần một kế toán có trình độ chuyên môn cao."},{"id":18,"set":1,"collocation":"make progress","meaning":"tiến bộ","situation":"You practise English every day and your English is getting better","translation":"Bạn sẽ tiến bộ nếu luyện tập mỗi ngày."},{"id":19,"set":1,"collocation":"meet requirements","meaning":"đáp ứng yêu cầu","situation":"People need the right experience and certificates before they can get this job","translation":"Ứng viên phải đáp ứng các yêu cầu về cả kinh nghiệm lẫn bằng cấp."},{"id":20,"set":1,"collocation":"strong argument","meaning":"lập luận mạnh","situation":"She gave clear and convincing reasons for making the programme longer","translation":"Cô ấy đưa ra một lập luận thuyết phục để kéo dài chương trình."},{"id":21,"set":1,"collocation":"sharp decrease","meaning":"mức giảm mạnh","situation":"The chart shows that people now use much less energy than before","translation":"Biểu đồ cho thấy mức giảm mạnh về sử dụng năng lượng."},{"id":22,"set":1,"collocation":"competent manager","meaning":"quản lý có năng lực","situation":"The manager has good skills and can solve problems calmly","translation":"Một quản lý có năng lực có thể giải quyết vấn đề một cách bình tĩnh."},{"id":23,"set":1,"collocation":"sign a contract","meaning":"ký hợp đồng","situation":"You will accept an important legal agreement and should check every part first","translation":"Bạn nên đọc từng điều khoản trước khi ký hợp đồng."},{"id":24,"set":1,"collocation":"prevent accidents","meaning":"ngăn tai nạn","situation":"The road is dark at night and more lights can stop people from getting hurt","translation":"Hệ thống chiếu sáng tốt hơn có thể giúp ngăn ngừa tai nạn vào ban đêm."},{"id":25,"set":1,"collocation":"unpredictable weather","meaning":"thời tiết thất thường","situation":"The weather changes suddenly in the mountains and can cause problems for travellers","translation":"Thời tiết khó đoán có thể làm gián đoạn các chuyến đi vùng núi."},{"id":26,"set":1,"collocation":"help someone with","meaning":"giúp ai việc gì","situation":"Your neighbour cannot carry a heavy suitcase alone","translation":"Bạn có thể giúp người hàng xóm với chiếc va-li nặng này không?"},{"id":27,"set":1,"collocation":"clear explanation","meaning":"lời giải thích rõ ràng","situation":"The students understood the new system because the trainer explained it well","translation":"Giảng viên đã đưa ra lời giải thích rõ ràng về hệ thống mới."},{"id":28,"set":1,"collocation":"refuse an offer","meaning":"từ chối đề nghị","situation":"The job gives no training so she may say that she does not want it","translation":"Cô ấy có thể từ chối một lời đề nghị không có chương trình đào tạo."},{"id":29,"set":1,"collocation":"regular meeting","meaning":"cuộc họp định kỳ","situation":"The team meets at the same time every Monday morning","translation":"Chúng tôi tổ chức một cuộc họp định kỳ vào mỗi sáng thứ Hai."},{"id":30,"set":1,"collocation":"reply promptly","meaning":"phản hồi nhanh","situation":"We need your answer soon before we can keep a place for you","translation":"Vui lòng trả lời kịp thời để chúng tôi có thể xác nhận chỗ của bạn."},{"id":31,"set":1,"collocation":"take effect","meaning":"có hiệu lực","situation":"The new parking rules will start being used next week","translation":"Các quy định đỗ xe mới sẽ có hiệu lực vào tuần tới."},{"id":32,"set":1,"collocation":"book a room","meaning":"đặt phòng","situation":"We are going to a conference and need somewhere nearby to sleep","translation":"Chúng ta cần đặt một phòng gần trung tâm hội nghị."},{"id":33,"set":1,"collocation":"conduct a survey","meaning":"tiến hành khảo sát","situation":"Researchers want to ask local people the same set of questions","translation":"Các nhà nghiên cứu sẽ tiến hành khảo sát cư dân địa phương."},{"id":34,"set":1,"collocation":"apologize for a mistake","meaning":"xin lỗi vì sai sót","situation":"You did something wrong and should tell the other person that you are sorry","translation":"Bạn nên xin lỗi về lỗi lầm ngay khi có thể."},{"id":35,"set":1,"collocation":"side effects","meaning":"tác dụng phụ","situation":"This medicine may cause other health problems and you should ask the doctor about them","translation":"Hãy hỏi bác sĩ về các tác dụng phụ có thể có của thuốc."},{"id":36,"set":1,"collocation":"wide range","meaning":"nhiều lựa chọn","situation":"The shop sells many different kinds of equipment for outdoor activities","translation":"Cửa hàng cung cấp nhiều loại thiết bị ngoài trời."},{"id":37,"set":1,"collocation":"raise funds","meaning":"gây quỹ","situation":"The charity organised a concert because it needed money for a shelter","translation":"Tổ chức từ thiện tổ chức hòa nhạc để gây quỹ cho mái ấm."},{"id":38,"set":1,"collocation":"closely related","meaning":"liên quan chặt chẽ","situation":"What people eat has a strong connection with their mental health","translation":"Chế độ ăn và sức khỏe tinh thần có liên quan chặt chẽ."},{"id":39,"set":1,"collocation":"fully prepared","meaning":"chuẩn bị đầy đủ","situation":"The team had completed everything before the inspection began","translation":"Nhóm đã chuẩn bị đầy đủ cho cuộc thanh tra."},{"id":40,"set":1,"collocation":"serious illness","meaning":"bệnh nghiêm trọng","situation":"He was very sick for a long time but later returned to work","translation":"Anh ấy trở lại làm việc sau một căn bệnh nghiêm trọng."},{"id":41,"set":1,"collocation":"consumer demand","meaning":"nhu cầu người tiêu dùng","situation":"More people want to buy electric cars now","translation":"Nhu cầu của người tiêu dùng đối với xe điện đang tăng."},{"id":42,"set":1,"collocation":"cautious approach","meaning":"cách tiếp cận thận trọng","situation":"The company did not expand quickly because it wanted to avoid unnecessary risks","translation":"Công ty áp dụng cách tiếp cận thận trọng đối với việc mở rộng."},{"id":43,"set":1,"collocation":"supply goods","meaning":"cung cấp hàng hóa","situation":"A farm will send its products to three markets near the farm","translation":"Trang trại sẽ cung cấp hàng hóa cho ba chợ địa phương."},{"id":44,"set":1,"collocation":"price adjustment","meaning":"điều chỉnh giá","situation":"The company changed its prices a little and told its customers about the change","translation":"Khách hàng được thông báo về một điều chỉnh giá nhỏ."},{"id":45,"set":1,"collocation":"build resilience","meaning":"xây dựng khả năng phục hồi","situation":"Small challenges can teach children to recover after difficult experiences","translation":"Những thử thách thường xuyên có thể giúp trẻ xây dựng khả năng phục hồi."},{"id":46,"set":1,"collocation":"essential information","meaning":"thông tin thiết yếu","situation":"New students can find the most important facts on the website","translation":"Trang web cung cấp thông tin thiết yếu cho sinh viên mới."},{"id":47,"set":1,"collocation":"significant decrease","meaning":"mức giảm đáng kể","situation":"The figures show that there are far fewer complaints than before","translation":"Các số liệu cho thấy mức giảm đáng kể về số khiếu nại."},{"id":48,"set":1,"collocation":"highly adaptable","meaning":"rất linh hoạt","situation":"These workers can change their way of working when a sudden problem happens","translation":"Nhân viên có khả năng thích nghi cao ứng phó tốt với thay đổi đột ngột."},{"id":49,"set":1,"collocation":"complicated issue","meaning":"vấn đề phức tạp","situation":"The problem has many difficult parts so the committee needs time to discuss it","translation":"Ủy ban đang thảo luận một vấn đề phức tạp."},{"id":50,"set":1,"collocation":"short break","meaning":"giờ nghỉ ngắn","situation":"Everyone is tired after the first session and needs to rest for a few minutes","translation":"Hãy nghỉ giải lao ngắn trước phiên tiếp theo."},{"id":51,"set":2,"collocation":"indicate a trend","meaning":"cho thấy xu hướng","situation":"The figures show that more people are choosing to shop on the internet","translation":"Những số liệu này cho thấy xu hướng mua sắm trực tuyến."},{"id":52,"set":2,"collocation":"make an impression","meaning":"tạo ấn tượng","situation":"Her professional clothes helped people notice and remember her at the interview","translation":"Trang phục chuyên nghiệp có thể giúp bạn tạo ấn tượng trong buổi phỏng vấn."},{"id":53,"set":2,"collocation":"address an audience","meaning":"phát biểu trước khán giả","situation":"The director will speak formally to five hundred people","translation":"Giám đốc sẽ phát biểu trước 500 khách mời."},{"id":54,"set":2,"collocation":"responsible for","meaning":"chịu trách nhiệm về","situation":"Mina has the duty of checking every invoice","translation":"Mina chịu trách nhiệm kiểm tra tất cả hóa đơn."},{"id":55,"set":2,"collocation":"increased costs","meaning":"chi phí tăng","situation":"Small companies now pay more for materials and services","translation":"Các doanh nghiệp nhỏ đang chật vật với chi phí gia tăng."},{"id":56,"set":2,"collocation":"deeply disappointed","meaning":"vô cùng thất vọng","situation":"The service was very bad and we felt extremely unhappy about it","translation":"Chúng tôi vô cùng thất vọng về dịch vụ kém."},{"id":57,"set":2,"collocation":"highly effective","meaning":"rất hiệu quả","situation":"The new treatment works very well for most patients","translation":"Phương pháp điều trị mới đã được chứng minh là rất hiệu quả."},{"id":58,"set":2,"collocation":"pose a risk","meaning":"gây rủi ro","situation":"Visitors may fall over the loose cables and hurt themselves","translation":"Dây cáp lỏng có thể gây rủi ro cho khách tham quan."},{"id":59,"set":2,"collocation":"draw a conclusion","meaning":"rút ra kết luận","situation":"We do not have enough facts yet so we cannot decide what the evidence means","translation":"Chúng ta cần thêm bằng chứng trước khi rút ra kết luận."},{"id":60,"set":2,"collocation":"widely accepted","meaning":"được chấp nhận rộng rãi","situation":"Most language teachers agree that this method is suitable","translation":"Phương pháp này được giáo viên ngôn ngữ chấp nhận rộng rãi."},{"id":61,"set":2,"collocation":"inspect equipment","meaning":"kiểm tra thiết bị","situation":"A efore the decision was made","translation":"Ủy ban đưa ra quyết định sau cuộc bỏ phiếu nhất trí."},{"id":199,"set":4,"collocation":"severe pain","meaning":"đau dữ dội","situation":"Her back hurt very badly so she needed to go to hospital","translation":"Cô ấy đến bệnh viện vì bị đau lưng dữ dội."},{"id":200,"set":4,"collocation":"tightly controlled","meaning":"được kiểm soát chặt","situation":"Only authorised people can open the records and the rules are very firm","translation":"Quyền truy cập hồ sơ được kiểm soát chặt chẽ."}];
const KEY='pop_dossier_match_lab_200_v1';
const ROUND_SIZE=6;
let state={set:1,round:0,completed:{},sound:true,study:false,game:'context'};
try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}
let cards=[],first=null,locked=false,elapsed=0,paused=false,timerId=null,audioCtx;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function seeded(items,seed){let a=items.slice(),x=seed*9301+49297;for(let i=a.length-1;i>0;i--){x=(x*233280+49297)%1000003;const j=x%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function setItems(){return seeded(DATA.filter(x=>x.set===state.set),state.set*97)}
function rounds(){return Math.ceil(setItems().length/ROUND_SIZE)}
function roundItems(){const a=setItems(),start=state.round*ROUND_SIZE;return a.slice(start,start+ROUND_SIZE)}
function splitCollocation(text){const words=text.trim().split(/\s+/);return [words[0],words.slice(1).join(' ')]}
function makeCards(){const list=[];for(const q of roundItems()){if(state.game==='columns'){const [a,b]=splitCollocation(q.collocation);list.push({uid:`a${q.id}`,pair:q.id,type:'left',text:a,vi:q.meaning,full:q.collocation});list.push({uid:`b${q.id}`,pair:q.id,type:'right',text:b,vi:'',full:q.collocation})}else{list.push({uid:`t${q.id}`,pair:q.id,type:'term',text:q.collocation,vi:q.meaning});list.push({uid:`s${q.id}`,pair:q.id,type:'clue',text:q.situation,vi:q.translation})}}if(state.game==='columns'){const left=seeded(list.filter(x=>x.type==='left'),state.set*101+state.round*17+Date.now()%997),right=seeded(list.filter(x=>x.type==='right'),state.set*211+state.round*29+Date.now()%991);cards=[...left,...right]}else cards=seeded(list,state.set*1000+state.round*41+Date.now()%997)}
function fx(ok){if(!state.sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=ok?760:190;g.gain.setValueAtTime(.1,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.2);o.start();o.stop(audioCtx.currentTime+.2)}catch(e){}}
function speak(text){if(!state.sound)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.9;speechSynthesis.speak(u)}
function completedSet(){const prefix=`${state.game}:`;return new Set(Object.keys(state.completed).filter(k=>state.completed[k]&&(k.startsWith(prefix)||(state.game==='context'&&/^\d+$/.test(k)))).map(k=>Number(k.includes(':')?k.split(':')[1]:k)))}
function currentDone(){const done=completedSet();return roundItems().filter(x=>done.has(x.id)).length}
function totalDone(){const done=completedSet();return DATA.filter(x=>x.set===state.set&&done.has(x.id)).length}
function cardButton(c,done){const b=document.createElement('button');b.className=`card ${c.type}`+(done.has(c.pair)?' matched':'');b.dataset.uid=c.uid;b.innerHTML=`<span>${c.text}${state.study&&c.vi?`<small>${c.vi}</small>`:''}</span>`;b.onclick=()=>choose(c,b);return b}
function renderCards(){const done=completedSet(),grid=$('grid');grid.innerHTML='';grid.classList.toggle('columns',state.game==='columns');if(state.game==='columns'){for(const [type,title] of [['left','COLUMN A'],['right','COLUMN B']]){const col=document.createElement('section');col.className='matchColumn';const h=document.createElement('h3');h.textContent=title;col.appendChild(h);for(const c of cards.filter(x=>x.type===type))col.appendChild(cardButton(c,done));grid.appendChild(col)}}else for(const c of cards)grid.appendChild(cardButton(c,done))}
function render(){document.body.classList.toggle('paused',paused);document.querySelectorAll('.setBtn').forEach((b,i)=>b.classList.toggle('active',i===state.set-1));$('roundLabel').textContent=`${state.game==='columns'?'COLUMNS A–B':'COLLOCATION + CLUE'}  •  SET ${state.set}  •  ROUND ${state.round+1} / ${rounds()}`;$('score').textContent=`${currentDone()} / ${roundItems().length} pairs  •  ${totalDone()} / 50 mastered`;$('meter').style.width=`${totalDone()*2}%`;$('sound').textContent=state.sound?'Sound on':'Sound off';$('mode').textContent=state.study?'Study EN + VI':'English only';$('game').textContent=state.game==='columns'?'Collocation + clue':'Columns A–B';$('pause').textContent=paused?'Resume':'Pause';renderCards();save()}
function choose(c,el){if(locked||paused||el.classList.contains('matched'))return;if(first&&first.c.uid===c.uid){el.classList.remove('selected');first=null;return}el.classList.add('selected');if(c.type==='term')speak(c.text);if(!first){first={c,el};return}locked=true;if(first.c.pair===c.pair&&first.c.type!==c.type){fx(true);state.completed[`${state.game}:${c.pair}`]=true;if(state.game==='columns')speak(c.full);first.el.classList.add('matched');el.classList.add('matched');first=null;locked=false;save();setTimeout(()=>{render();if(currentDone()===roundItems().length)finishRound()},260)}else{fx(false);first.el.classList.add('wrong');el.classList.add('wrong');setTimeout(()=>{first.el.classList.remove('selected','wrong');el.classList.remove('selected','wrong');first=null;locked=false},520)}}
function startClock(reset=true){clearInterval(timerId);if(reset)elapsed=0;paused=false;paintClock();timerId=setInterval(()=>{if(!paused){elapsed+=.1;paintClock()}},100)}
function paintClock(){$('clock').textContent=elapsed.toFixed(1);document.body.classList.toggle('paused',paused);$('pause').textContent=paused?'Resume':'Pause'}
function finishRound(){clearInterval(timerId);paused=true;paintClock();const last=state.round>=rounds()-1;$('stamp').textContent=last?'SET COMPLETE':'ROUND COMPLETE';$('resultTitle').textContent=`${elapsed.toFixed(1)} seconds`;$('resultText').textContent=last?`You matched all 50 collocations in Set ${state.set}`:`You matched ${roundItems().length} pairs with no cards left`;$('continue').textContent=last?(state.set<4?'Start next set':'Review from Set 1'):'Next round';$('overlay').classList.add('show')}
function changeSet(n){state.set=n;state.round=0;first=null;locked=false;makeCards();render();startClock(true);if(currentDone()===roundItems().length)setTimeout(finishRound,120)}
function nextRound(){$('overlay').classList.remove('show');if(state.round<rounds()-1)state.round++;else if(state.set<4){state.set++;state.round=0}else{state={set:1,round:0,completed:{},sound:state.sound,study:state.study,game:state.game}}makeCards();render();startClock(true)}
function resetRound(){for(const q of roundItems()){delete state.completed[`${state.game}:${q.id}`];if(state.game==='context')delete state.completed[q.id]}first=null;locked=false;makeCards();render();startClock(true)}
function init(){for(let s=1;s<=4;s++){const b=document.createElement('button');b.className='setBtn';b.textContent=`SET ${s}  ${1+(s-1)*50}–${s*50}`;b.onclick=()=>changeSet(s);$('sets').appendChild(b)}$('pause').onclick=()=>{paused=!paused;paintClock()};$('sound').onclick=()=>{state.sound=!state.sound;if(!state.sound)speechSynthesis.cancel();else fx(true);render()};$('mode').onclick=()=>{state.study=!state.study;render()};$('game').onclick=()=>{state.game=state.game==='columns'?'context':'columns';first=null;locked=false;makeCards();render();startClock(true)};$('shuffle').onclick=()=>{makeCards();first=null;renderCards()};$('resetRound').onclick=resetRound;$('resetAll').onclick=()=>{if(confirm('Reset all four sets and both matching modes?')){state={set:1,round:0,completed:{},sound:state.sound,study:state.study,game:state.game};makeCards();render();startClock(true)}};$('continue').onclick=nextRound;makeCards();render();startClock(true);if(currentDone()===roundItems().length)setTimeout(finishRound,120)}
init();
</script>
</body>
</html>
